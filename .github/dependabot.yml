name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronized]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Explicitly verify the PR actor is Dependabot
    if: github.actor == 'dependabot[bot]'
    
    steps:
      # 1. Fetch package metadata (Upgraded to v3)
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # 2. Automatically approve and queue the merge
      - name: Approve and Auto-Merge Safe Updates
        # Merges if it's a Patch OR a Minor update (Blocks Major breaking updates)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
