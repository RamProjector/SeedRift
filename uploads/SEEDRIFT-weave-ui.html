<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weave — Seedrift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10150F;
    --bg-card: #171E19;
    --bg-card-active: #1A2820;
    --border: #2A332C;
    --border-active: #4C9C7C;
    --text-primary: #ECE9E0;
    --text-secondary: #9CA79C;
    --text-muted: #62695F;
    --accent: #5FE6B4;
    --warn: #E6A855;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen { max-width: 460px; margin: 0 auto; padding: 28px 20px 56px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .title { font-size: 19px; font-weight: 600; margin: 0; }
  .capacity-value { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--accent); }
  .cells { display: flex; gap: 5px; margin-bottom: 6px; }
  .cell {
    flex: 1;
    height: 14px;
    border-radius: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: background .3s ease, border-color .3s ease;
  }
  .cell.filled { background: var(--accent); border-color: var(--accent); }
  .capacity-warning {
    font-size: 12.5px;
    color: var(--warn);
    margin-bottom: 6px;
    opacity: 0;
    transition: opacity .2s ease;
    min-height: 16px;
  }
  .capacity-warning.show { opacity: 1; }
  .splice-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .card {
    width: 100%;
    text-align: left;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: inherit;
    color: inherit;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .card:hover { border-color: var(--border-active); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.equipped { background: var(--bg-card-active); border-color: var(--border-active); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .card-cat { font-size: 13px; color: var(--text-muted); }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid var(--border);
    margin-top: 3px; flex-shrink: 0;
    transition: background .2s ease, border-color .2s ease;
  }
  .card.equipped .dot { background: var(--accent); border-color: var(--accent); }
  .card-source { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .card-effect { font-size: 13.5px; color: var(--text-primary); margin-top: 9px; line-height: 1.45; }
  .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; gap: 10px; }
  .tradeoff { font-size: 12px; color: var(--warn); line-height: 1.4; }
  .cost { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
</style>
</head>
<body>
<div class="screen">
  <div class="header-row">
    <h1 class="title">The Weave</h1>
    <span class="capacity-value" id="capVal">0 / 6</span>
  </div>
  <div class="cells" id="cells"></div>
  <div class="capacity-warning" id="warning" role="status" aria-live="polite"></div>

  <div class="splice-list" id="list"></div>
</div>

<script>
const MAX = 6;
const splices = [
  { id: "s1", name: "Frostmoss weave", source: "Frost-moss · Thessyra's Veil", effect: "Cold tolerance in sub-zero biomes.", cost: 2, category: "Thermal", tradeoff: "Reduced heat tolerance.", equipped: true },
  { id: "s2", name: "Trench pressure sac", source: "Trench-dweller · Vantauri Deep", effect: "Deep-ocean pressure resistance.", cost: 3, category: "Pressure", tradeoff: "Slower movement on land.", equipped: false },
  { id: "s3", name: "Driftmoth membrane", source: "Driftmoth · Kharon's Bloomfields", effect: "Glide, reduced fall damage.", cost: 2, category: "Mobility", tradeoff: null, equipped: true },
  { id: "s4", name: "Glow-beast skin", source: "Glow-beast · Pallid Reach", effect: "Passive light most predators ignore.", cost: 1, category: "Sensory", tradeoff: "Faint glow still visible to sharp-eyed hunters.", equipped: true },
  { id: "s5", name: "Symbiotic regen fungus", source: "Unclassified symbiote", effect: "Slow health regeneration.", cost: 2, category: "Metabolic", tradeoff: "Needs feeding organic matter, or it dies and regen stops.", equipped: false },
  { id: "s6", name: "Burrower claw tendons", source: "Unclassified burrower", effect: "Limited tunneling.", cost: 2, category: "Mobility", tradeoff: "Reduced climbing grip.", equipped: false },
  { id: "s7", name: "Spore-toxin filter", source: "Ground-swarm · Kharon's Bloomfields", effect: "Spore and toxin resistance.", cost: 1, category: "Metabolic", tradeoff: null, equipped: false }
];

let warningTimer = null;
let lastToggledId = null;

function usedCapacity() {
  return splices.filter(s => s.equipped).reduce((sum, s) => sum + s.cost, 0);
}

function showWarning(msg) {
  const w = document.getElementById('warning');
  w.textContent = msg;
  w.classList.add('show');
  clearTimeout(warningTimer);
  warningTimer = setTimeout(() => w.classList.remove('show'), 3000);
}

function clearWarning() {
  const w = document.getElementById('warning');
  w.classList.remove('show');
  clearTimeout(warningTimer);
}

function toggle(id) {
  const s = splices.find(x => x.id === id);
  const used = usedCapacity();
  if (!s.equipped && used + s.cost > MAX) {
    showWarning(`Not enough capacity for ${s.name} — needs ${s.cost}, only ${MAX - used} free.`);
    return;
  }
  s.equipped = !s.equipped;
  lastToggledId = id;
  clearWarning();
  render();
}

function render() {
  const used = usedCapacity();
  document.getElementById('capVal').textContent = `${used} / ${MAX}`;

  const cellsEl = document.getElementById('cells');
  cellsEl.innerHTML = '';
  for (let i = 0; i < MAX; i++) {
    const c = document.createElement('div');
    c.className = 'cell' + (i < used ? ' filled' : '');
    cellsEl.appendChild(c);
  }

  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  splices.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'card' + (s.equipped ? ' equipped' : '');
    btn.dataset.id = s.id;
    btn.setAttribute('aria-pressed', s.equipped ? 'true' : 'false');
    btn.onclick = () => toggle(s.id);
    btn.innerHTML = `
      <div class="card-top">
        <div>
          <span class="card-name">${s.name}</span><span class="card-cat"> · ${s.category}</span>
          <div class="card-source">${s.source}</div>
        </div>
        <div class="dot"></div>
      </div>
      <div class="card-effect">${s.effect}</div>
      <div class="card-bottom">
        <div class="tradeoff">${s.tradeoff ? s.tradeoff : ''}</div>
        <div class="cost">${s.cost} cap</div>
      </div>
    `;
    listEl.appendChild(btn);
  });

  if (lastToggledId) {
    const el = listEl.querySelector(`[data-id="${lastToggledId}"]`);
    if (el) el.focus();
  }
}

render();
</script>

</html>
