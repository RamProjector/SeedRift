<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEEDRIFT — Worlds That Remember</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvasContainer"></div>

  <!-- Fallback WebGL Warning (hidden unless WebGL fails) -->
  <div id="webglErrorFallback" class="webgl-error-card hidden">
    <h3>⚠️ WebGL Context Notice</h3>
    <p>3D WebGL rendering is currently running in fallback mode. You can still navigate worlds, manage Weave suit splices, view species in the Codex, and collect planetary samples!</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
